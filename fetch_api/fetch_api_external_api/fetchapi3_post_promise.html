<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch POST (Promises)</title>
</head>
<body>
    <h1>Add Post (Promises)</h1>
    <form id="addform">
        <div>
            <label for="title">Title : </label>
            <input type="text" id="title" required>
        </div>
        <div>
            <label for="body">Body : </label>
            <textarea id="body" cols="30" rows="2" required></textarea>
        </div>
        <div>
            <input type="submit" value="Add">
            <input type="reset" value="Reset">
        </div>
    </form>
    <pre id="result"></pre>

    <script>
        document.getElementById("addform").addEventListener("submit", addpost)
        function addpost(e) {
            e.preventDefault()
            let title = document.getElementById("title").value
            let body = document.getElementById("body").value
            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Accept": "application/json, text/plain, */*",
                    "Content-type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    body: body
                })
            })
            .then((response) => response.json())
            .then((data) => {
                console.log(data)
                document.getElementById("result").textContent = "Server Response:\n" + JSON.stringify(data, null, 2)
            })
        }
    </script>
</body>
</html>
