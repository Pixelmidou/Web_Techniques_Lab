<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students CRUD &amp; Sorting (Fetch API)</title>
    <style>
        div { margin: 10px; }
        tr, td, th { padding: 8px; }
        .x { display: flex; gap: 10px; }
        #resmsg { text-align: center; font-weight: bold; font-size: 16px; }
        .ti { font-weight: bold; font-size: 16px; text-decoration: underline; }
        .modsec, .delsec, .modname, .moddob, .modmark { display: none; }
    </style>
</head>
<body>
    <h1>List of Students</h1>
    <div id="aff"></div>
    <div id="recs"></div>
    <div id="butsaff"></div>

    <div>
        View As :
        <input type="radio" name="t" id="list" checked>
        <label for="list"> List</label>
        <input type="radio" name="t" id="table">
        <label for="table"> Table</label>
    </div>

    <div>
        <label for="order">Order by : </label>
        <select id="order">
            <option value="0">Id : Ascending</option>
            <option value="1">Id : Descending</option>
            <option value="2">Name : A to Z</option>
            <option value="3">Name : Z to A</option>
            <option value="4">Date Of Birth : Ascending</option>
            <option value="5">Date Of Birth : Descending</option>
            <option value="6">Total Mark : Ascending</option>
            <option value="7">Total Mark : Descending</option>
        </select>
    </div>

    <div class="x">
        <div>
            <fieldset>
                <legend>Actions on Students :</legend>
                <div>
                    Actions :
                    <input type="radio" name="acc" id="adds" checked>
                    <label for="adds">Add a Student</label>
                    <input type="radio" name="acc" id="modi">
                    <label for="modi">Modify a Student</label>
                    <input type="radio" name="acc" id="del">
                    <label for="del">Delete a Student</label>
                </div>

                <!-- Add Student -->
                <form class="addsec" id="addsec">
                    <hr>
                    <div class="ti">Add a Student :</div>
                    <div>
                        <label for="aname">Name : </label>
                        <input type="text" id="aname" required>
                    </div>
                    <div>
                        <label for="adob">Date Of Birth : </label>
                        <input type="date" id="adob" required>
                    </div>
                    <div>
                        <label for="amark">Total Mark : </label>
                        <input type="number" id="amark" step="any" min="0" max="20" required>
                    </div>
                    <hr>
                    <div>
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit">
                    </div>
                </form>

                <!-- Modify Student -->
                <form class="modsec" id="modsec">
                    <hr>
                    <div class="ti">Modify a Student :</div>
                    <div>
                        <label for="mid">Student Id : </label>
                        <input type="number" id="mid" min="1" required>
                    </div>
                    <div>
                        Modify :
                        <input type="checkbox" id="maccname">
                        <label for="maccname">Name</label>
                        <input type="checkbox" id="maccdob">
                        <label for="maccdob">Date Of Birth</label>
                        <input type="checkbox" id="maccmark">
                        <label for="maccmark">Total Mark</label>
                    </div>
                    <div id="modname" class="modname">
                        <label for="mname">Name : </label>
                        <input type="text" id="mname">
                    </div>
                    <div id="moddob" class="moddob">
                        <label for="mdob">Date Of Birth : </label>
                        <input type="date" id="mdob">
                    </div>
                    <div id="modmark" class="modmark">
                        <label for="mmark">Total Mark : </label>
                        <input type="number" id="mmark" step="any" min="0" max="20">
                    </div>
                    <hr>
                    <div>
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit">
                    </div>
                </form>

                <!-- Delete Student -->
                <form class="delsec" id="delsec">
                    <hr>
                    <div class="ti">Delete a Student :</div>
                    <div>
                        <label for="did">Student Id : </label>
                        <input type="number" id="did" min="1" required>
                    </div>
                    <hr>
                    <div>
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit">
                    </div>
                </form>

                <div id="resmsg"></div>
            </fieldset>
        </div>
    </div>

    <script>
        var i = 0
        var totalRecords = 0

        function showMessage(text, isError) {
            var el = document.getElementById("resmsg")
            el.style.color = isError ? "red" : "green"
            el.textContent = text
            setTimeout(() => { el.textContent = "" }, 3000)
        }

        function renderStudents(rows) {
            var isList = document.getElementById("list").checked
            if (rows.length === 0) {
                document.getElementById("aff").innerHTML = "<p>No students found.</p>"
                return
            }
            if (isList) {
                var output = ""
                rows.forEach((stud) => {
                    output += `
                        <ul>
                            <li>Id : ${stud[0]}</li>
                            <li>Name : ${stud[1]}</li>
                            <li>Date Of Birth : ${stud[2]}</li>
                            <li>Total Mark : ${stud[3]}</li>
                        </ul>`
                })
                document.getElementById("aff").innerHTML = output
            } else {
                var html = `
                    <table border="1">
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Date Of Birth</th>
                            <th>Total Mark</th>
                        </tr>`
                rows.forEach((stud) => {
                    html += `
                        <tr>
                            <td>${stud[0]}</td>
                            <td>${stud[1]}</td>
                            <td>${stud[2]}</td>
                            <td>${stud[3]}</td>
                        </tr>`
                })
                html += `</table>`
                document.getElementById("aff").innerHTML = html
            }
        }

        function renderPagination() {
            var totalPages = Math.max(1, Math.ceil(totalRecords / 2))
            var currentPage = Math.floor(i / 2) + 1
            document.getElementById("recs").textContent = `Showing page ${currentPage} out of ${totalPages} (${totalRecords} students)`

            var html = `<input type="button" value="First" onclick="goFirst()"> `
            html += `<input type="button" value="Previous" onclick="goPrev()"> `
            for (var p = 1; p <= totalPages; p++) {
                html += `<input type="button" value="${p}" onclick="goPage(${p})"> `
            }
            html += `<input type="button" value="Next" onclick="goNext()"> `
            html += `<input type="button" value="Last" onclick="goLast()">`
            document.getElementById("butsaff").innerHTML = html
        }

        async function loadData() {
            var choice = document.getElementById("order").selectedIndex
            var url = choice === 0 ? "fetchapi6.php" : "fetchapi6_2.php"
            var body = choice === 0 ? `i=${i}` : `i=${i}&j=${choice}`

            var response = await fetch(url, {
                method: "POST",
                headers: { "Content-type": "application/x-www-form-urlencoded" },
                body: body
            })
            var data = await response.json()
            totalRecords = Number(data[data.length - 1]) || 0

            // Clamp offset if records were deleted on the last page
            if (i >= totalRecords && i > 0) {
                i = Math.max(0, Math.floor((totalRecords - 1) / 2) * 2)
                return loadData()
            }

            renderStudents(data.slice(0, -1))
            renderPagination()
        }

        function goFirst() { i = 0; loadData(); }
        function goPrev() { if (i >= 2) { i -= 2; loadData(); } }
        function goNext() { if (i + 2 < totalRecords) { i += 2; loadData(); } }
        function goLast() { i = Math.max(0, Math.floor((totalRecords - 1) / 2) * 2); loadData(); }
        function goPage(p) { i = (p - 1) * 2; loadData(); }

        // Toggle Modify field inputs
        function toggleField(checkboxId, elementId) {
            document.getElementById(checkboxId).addEventListener("change", (e) => {
                document.getElementById(elementId).style.display = e.target.checked ? "block" : "none"
            })
        }
        toggleField("maccname", "modname")
        toggleField("maccdob", "moddob")
        toggleField("maccmark", "modmark")

        // Switch Add / Modify / Delete forms
        function bindSection(radioId, formId) {
            document.getElementById(radioId).addEventListener("click", () => {
                document.getElementById("addsec").style.display = "none"
                document.getElementById("modsec").style.display = "none"
                document.getElementById("delsec").style.display = "none"
                document.getElementById(formId).style.display = "block"
            })
        }
        bindSection("adds", "addsec")
        bindSection("modi", "modsec")
        bindSection("del", "delsec")

        // Add student
        document.getElementById("addsec").addEventListener("submit", async (e) => {
            e.preventDefault()
            var params = new URLSearchParams({
                action: "add",
                name: document.getElementById("aname").value,
                dob: document.getElementById("adob").value,
                mark: document.getElementById("amark").value
            })
            var res = await (await fetch("fetchapi6_3.php", { method: "POST", body: params })).json()
            if (res[0] == "1") {
                showMessage("Student Added Successfully", false)
                document.getElementById("addsec").reset()
                loadData()
            } else {
                showMessage("Failed to add student", true)
            }
        })

        // Modify student
        document.getElementById("modsec").addEventListener("submit", async (e) => {
            e.preventDefault()
            var params = new URLSearchParams({
                action: "modify",
                id: document.getElementById("mid").value
            })
            if (document.getElementById("maccname").checked) params.append("name", document.getElementById("mname").value)
            if (document.getElementById("maccdob").checked) params.append("dob", document.getElementById("mdob").value)
            if (document.getElementById("maccmark").checked) params.append("mark", document.getElementById("mmark").value)

            var res = await (await fetch("fetchapi6_3.php", { method: "POST", body: params })).json()
            if (res[0] == "1") {
                showMessage("Student Updated Successfully", false)
                document.getElementById("modsec").reset()
                document.getElementById("modname").style.display = "none"
                document.getElementById("moddob").style.display = "none"
                document.getElementById("modmark").style.display = "none"
                loadData()
            } else {
                showMessage("No student updated (check Id and fields)", true)
            }
        })

        // Delete student
        document.getElementById("delsec").addEventListener("submit", async (e) => {
            e.preventDefault()
            var params = new URLSearchParams({
                action: "delete",
                id: document.getElementById("did").value
            })
            var res = await (await fetch("fetchapi6_3.php", { method: "POST", body: params })).json()
            if (res[0] == "1") {
                showMessage("Student Deleted Successfully", false)
                document.getElementById("delsec").reset()
                loadData()
            } else {
                showMessage("Student Id not found", true)
            }
        })

        document.getElementById("order").addEventListener("change", () => { i = 0; loadData(); })
        document.getElementById("list").addEventListener("click", loadData)
        document.getElementById("table").addEventListener("click", loadData)

        loadData()
    </script>
</body>
</html>
